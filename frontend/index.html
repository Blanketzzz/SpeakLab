<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeakLab · Public Speaking Coach</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #f6f3ea;
        color: #1f2a24;
        font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
      }
      #boot {
        max-width: 36rem;
        margin: 18vh auto 0;
        padding: 1.25rem;
        border: 3px solid #1f2a24;
        background: #fffdf7;
        box-shadow: 6px 6px 0 rgba(31, 42, 36, 0.85);
      }
      #boot h1 {
        margin: 0 0 0.5rem;
        font-size: 1.6rem;
      }
      #boot p {
        margin: 0;
        line-height: 1.5;
        color: #4a5a52;
      }
      #boot code {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.85em;
      }
      #root:not(:empty) + #boot,
      #root:not(:empty) ~ #boot {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <h1>SpeakLab</h1>
      <p id="boot-msg">Loading… If this stays blank, your network may be blocking the app scripts.</p>
      <p style="margin-top:0.75rem">
        Campus / local server:
        <code>https://10.123.4.1/</code>
        (accept the certificate warning once for camera)
      </p>
    </div>
    <script>
      // Show a clearer hint if the bundle never mounts.
      window.setTimeout(function () {
        var root = document.getElementById("root");
        var msg = document.getElementById("boot-msg");
        if (root && msg && !root.children.length) {
          msg.textContent =
            "Still loading or blocked. Try Chrome/Edge, disable VPN briefly, or use the campus link below.";
        }
      }, 4000);
      window.addEventListener("error", function (ev) {
        var msg = document.getElementById("boot-msg");
        if (msg) {
          msg.textContent =
            "Failed to start: " + (ev.message || "script error") +
            ". Try campus link http://10.123.4.1/ or another network.";
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
