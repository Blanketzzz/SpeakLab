services:
  - type: web
    name: speaklab
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: KELAI_API_KEY
        sync: false
      - key: KELAI_BASE_URL
        value: https://kelaiapi.cc/v1
      - key: KELAI_MODEL
        value: gemini-2.5-flash-lite
      - key: MAX_UPLOAD_MB
        value: "120"
