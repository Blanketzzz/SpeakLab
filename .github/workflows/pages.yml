name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        env:
          # Project Pages URL path
          VITE_BASE: /SpeakLab/
          # Backend HTTPS endpoint (Cloudflare tunnel or other public API)
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          npm ci
          if [ -z "$VITE_API_BASE" ]; then
            echo "Set repository variable VITE_API_BASE to your public API origin, e.g. https://xxxx.trycloudflare.com"
            exit 1
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
